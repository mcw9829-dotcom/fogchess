# fly.toml app configuration file generated for fogchess on 2026-09-07T09:57:26+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fogchess'
primary_region = 'nrt'

[build]
[env]
  FOG_DB = '/data/fogchess.db'

[[mounts]]
  source = 'fogchess_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpus = 1
  memory_mb = 256
